
spring.application.name=pulsewatch

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pulsewatch}
spring.datasource.username=${DB_USERNAME:pulsewatch}
spring.datasource.password=${DB_PASSWORD:pulsewatch_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway manages database schema changes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate validates Flyway's schema; it does not create tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-migration-naming=true

# Store application timestamps consistently
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.frontend-url=${FRONTEND_URL}
