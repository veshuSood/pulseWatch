
services:
  postgres:
    image: postgres:17
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsewatch
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev_password
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "D:/Dev/docker/pulsewatch-postgres/data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 3s
      retries: 10
